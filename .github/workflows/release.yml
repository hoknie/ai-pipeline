# A release of @hoknie/aip, started one of two ways:
#   - a pushed tag vX.Y.Z[-pre] naming the version in package.json (prepared locally with
#     `just release`, committed and tagged by hand);
#   - "Run workflow" (workflow_dispatch) on main with a level: the job `prepare` bumps the version
#     (package.json, package-lock.json, the plugin manifest), writes its CHANGELOG.md section, commits
#     "chore(release): release vX.Y.Z", tags it and pushes both to main.
# Then: the tag must name the version (check), the gate runs on it (ci.yml), the npm tarball is
# packed with SHA256SUMS, published to npm with provenance and attached to the GitHub Release, whose
# notes are the CHANGELOG.md section of the version. Nothing is published unless every check passed.
# npm: trusted publishing (configure the npm package to trust this workflow and the environment
# `release`) or, failing that, the secret NPM_TOKEN in the environment `release`.
# A tag with a "-" (v1.2.0-rc.1) is a prerelease: npm dist-tag `next`, GitHub prerelease.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      level:
        description: 'Next version: auto (from the commits), patch, minor, major or an exact X.Y.Z'
        required: true
        default: auto

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "release: run the workflow on main, not on $GITHUB_REF" >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Bump the version and write its CHANGELOG.md section
        id: release
        env:
          LEVEL: ${{ inputs.level }}
        run: |
          scripts/changelog.sh release "$LEVEL"
          version="$(scripts/release.sh version)"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Commit, tag and push
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json integrations/claude-code/.claude-plugin/plugin.json CHANGELOG.md
          git commit -m "chore(release): release $TAG"
          git tag -a "$TAG" -m "aip $TAG"
          git push --atomic origin HEAD:main "refs/tags/$TAG"

  check:
    needs: prepare
    if: ${{ !cancelled() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: tag
        env:
          TAG: ${{ needs.prepare.outputs.tag || github.ref_name }}
        run: echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
      - name: The tag names the version in package.json and the plugin manifest
        id: version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: echo "version=$(scripts/release.sh check-tag "$TAG")" >> "$GITHUB_OUTPUT"

  gates:
    needs: check
    if: ${{ !cancelled() && needs.check.result == 'success' }}
    uses: ./.github/workflows/ci.yml
    with:
      ref: refs/tags/${{ needs.check.outputs.tag }}

  pack:
    needs: [check, gates]
    if: ${{ !cancelled() && needs.gates.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.check.outputs.tag }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: The npm tarball (built on pack) and SHA256SUMS
        run: scripts/release.sh pack
      - name: The packed CLI installs and says its version
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          prefix="$RUNNER_TEMP/aip-prefix"
          npm install --global --prefix "$prefix" dist/release/*.tgz
          answer="$("$prefix/bin/aip" --version)"
          echo "$answer"
          [ "$answer" = "$VERSION" ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [check, pack]
    if: ${{ !cancelled() && needs.pack.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      TAG: ${{ needs.check.outputs.tag }}
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.check.outputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist/release
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          name="$(node -p 'require("./package.json").name')"
          if npm view "$name@$VERSION" version >/dev/null 2>&1; then
            echo "$name@$VERSION is already on npm; not published again"
            exit 0
          fi
          case "$VERSION" in
          *-*) dist_tag=next ;;
          *) dist_tag=latest ;;
          esac
          npm publish dist/release/*.tgz --access public --provenance --tag "$dist_tag"
      - name: The GitHub Release
        run: |
          scripts/release.sh notes > "$RUNNER_TEMP/release-notes.md"
          case "$TAG" in
          *-*) marking=(--prerelease) ;;
          *) marking=(--latest) ;;
          esac
          assets=(dist/release/*.tgz dist/release/SHA256SUMS)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber "${assets[@]}"
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$TAG" \
              --title "aip $TAG" \
              --verify-tag \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              "${marking[@]}" \
              "${assets[@]}"
          fi
