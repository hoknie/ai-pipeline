max: 3
roles:
  think: { name: Think }
  code: { name: Code }
  light: { name: Light }
workspace:
  base: working_tree
delivery:
  mode: worktree
  auto: true
claude:
  mcp: isolated
  settings: isolated
# a service registry connection: aip integration add service-registry main --global --param url=...
mcp_servers:
  registry:
    connection: main
defaults:
  runtime: claude
  permissions: edit
  timeout: 30m
  allow_commands:
    - npm run build*
    - npm test*
    - npm run format*
    - npm run typecheck*
  tools: []
