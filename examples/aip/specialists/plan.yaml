name: Planner
model: opus
skills:
  - grill-me
# the tools of the service registry; needs the connection `main` (see mcp_servers in settings.yaml)
mcp_servers: [registry]
prompt: >
  Start with get_project, list_specs, list_adrs and get_dependencies of the
  project in the registry; its path is in the message ("Service registry
  project"). Write an implementation plan for the task and return it in the
  report summary, without separate files: %s
